<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Ilustrasi pendampingan ANBK">
  <rect width="1200" height="800" fill="#f7f4ec"/>
  <rect x="0" y="0" width="1200" height="120" fill="#14563f"/>
  <text x="600" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#f7f4ec" letter-spacing="4">PENDAMPINGAN ANBK</text>
  <!-- laptop -->
  <g transform="translate(430,260)">
    <rect x="0" y="0" width="340" height="220" rx="14" fill="#0b3d2e"/>
    <rect x="20" y="20" width="300" height="180" rx="8" fill="#f7f4ec"/>
    <g stroke="#d9a13b" stroke-width="8" stroke-linecap="round">
      <line x1="50" y1="60" x2="170" y2="60"/>
      <line x1="50" y1="96" x2="140" y2="96"/>
    </g>
    <g fill="#14563f">
      <rect x="50" y="130" width="40" height="46" rx="6"/>
      <rect x="104" y="110" width="40" height="66" rx="6"/>
      <rect x="158" y="84" width="40" height="92" rx="6"/>
    </g>
    <path d="M 240 170 h 60 v -70 a 30 30 0 0 1 -60 0 Z" fill="#d9a13b"/>
    <rect x="-40" y="220" width="420" height="30" rx="14" fill="#14563f"/>
  </g>
  <!-- wifi -->
  <g transform="translate(900,300)" stroke="#d9a13b" stroke-width="12" fill="none" stroke-linecap="round">
    <path d="M -60 60 a 90 90 0 0 1 120 0"/>
    <path d="M -30 90 a 50 50 0 0 1 60 0"/>
    <circle cx="0" cy="120" r="10" fill="#d9a13b" stroke="none"/>
  </g>
  <!-- students -->
  <g>
    <circle cx="260" cy="560" r="42" fill="#0b3d2e"/><rect x="228" y="600" width="64" height="80" rx="20" fill="#d9a13b"/>
    <circle cx="600" cy="580" r="42" fill="#0b3d2e"/><rect x="568" y="620" width="64" height="80" rx="20" fill="#17694d"/>
    <circle cx="920" cy="560" r="42" fill="#0b3d2e"/><rect x="888" y="600" width="64" height="80" rx="20" fill="#d9a13b"/>
  </g>
  <!-- mini laptops -->
  <g fill="#ffffff" stroke="#c9c2ab" stroke-width="4">
    <rect x="200" y="640" width="120" height="70" rx="10"/>
    <rect x="540" y="660" width="120" height="70" rx="10"/>
    <rect x="860" y="640" width="120" height="70" rx="10"/>
  </g>
  <rect x="0" y="720" width="1200" height="80" fill="#e9e3d2"/>
</svg>

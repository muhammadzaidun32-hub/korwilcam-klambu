  <!-- sky -->
  <circle cx="980" cy="220" r="56" fill="#e6b34e"/>
  <g fill="#ffffff" opacity=".8">
    <ellipse cx="240" cy="200" rx="70" ry="22"/>
    <ellipse cx="320" cy="230" rx="90" ry="20"/>
    <ellipse cx="800" cy="180" rx="60" ry="18"/>
  </g>
  <!-- flag pole -->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Ilustrasi penguatan literasi">
  <rect width="1200" height="800" fill="#f7f4ec"/>
  <rect x="0" y="0" width="1200" height="120" fill="#14563f"/>
  <text x="600" y="76" text-anchor="middle" font-family="Georgia, serif" font-size="40" font-weight="bold" fill="#f7f4ec" letter-spacing="4">POJOK LITERASI</text>
  <!-- book stack -->
  <g transform="translate(150,420)">
    <rect x="0" y="160" width="240" height="50" rx="10" fill="#14563f"/>
    <rect x="16" y="110" width="240" height="50" rx="10" fill="#d9a13b"/>
    <rect x="8" y="60" width="240" height="50" rx="10" fill="#17694d"/>
    <rect x="24" y="10" width="240" height="50" rx="10" fill="#e6b34e"/>
    <circle cx="60" cy="35" r="16" fill="#f7f4ec"/>
    <circle cx="60" cy="85" r="16" fill="#f7f4ec"/>
  </g>
  <!-- open book big -->
  <g transform="translate(480,380)">
    <path d="M 0 220 C 90 170, 190 170, 240 200 L 240 60 C 190 30, 90 30, 0 80 Z" fill="#ffffff" stroke="#14563f" stroke-width="6" stroke-linejoin="round"/>
    <path d="M 480 220 C 390 170, 290 170, 240 200 L 240 60 C 290 30, 390 30, 480 80 Z" fill="#ffffff" stroke="#14563f" stroke-width="6" stroke-linejoin="round"/>
    <g stroke="#c9c2ab" stroke-width="6" stroke-linecap="round">
      <line x1="40" y1="110" x2="200" y2="90"/>
      <line x1="40" y1="150" x2="200" y2="130"/>
      <line x1="40" y1="190" x2="170" y2="172"/>
      <line x1="280" y1="90" x2="440" y2="110"/>
      <line x1="280" y1="130" x2="440" y2="150"/>
      <line x1="280" y1="172" x2="410" y2="190"/>
    </g>
  </g>
  <!-- lamp -->
  <g transform="translate(1000,420)">
    <path d="M 60 0 L 120 90 L 0 90 Z" fill="#d9a13b"/>
    <rect x="50" y="90" width="20" height="60" fill="#0b3d2e"/>
    <ellipse cx="60" cy="160" rx="50" ry="12" fill="#0b3d2e"/>
    <circle cx="60" cy="105" r="14" fill="#f3e7c8"/>
  </g>
  <!-- floating letters -->
  <g font-family="Georgia, serif" font-weight="bold" fill="#d9a13b" font-size="52">
    <text x="240" y="240">A</text>
    <text x="330" y="200">B</text>
    <text x="420" y="250">C</text>
    <text x="760" y="240">a</text>
    <text x="830" y="200">b</text>
    <text x="900" y="250">c</text>
  </g>
  <rect x="0" y="720" width="1200" height="80" fill="#e9e3d2"/>
</svg>
